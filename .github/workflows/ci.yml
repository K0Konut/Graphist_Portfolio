name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  # Sur main, deploiement.yml l'appelle avant de construire l'image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # build = vue-tsc (type-check) + vite build
      - run: npm run build
