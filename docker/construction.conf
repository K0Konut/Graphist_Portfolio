# Le site est caché pour le moment : toute adresse répond 503 avec la page en construction.
# 503 + Retry-After : les moteurs gardent ce qu'ils ont indexé au lieu de le remplacer par cette page.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "86400" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 503 /construction.html;
    location = /construction.html { internal; }
    location = /favicon.svg { }
    location / { return 503; }
}
