# Serveur du site statique. HTTPS et HSTS : Nginx Proxy Manager, devant ce conteneur.

# Fichiers Vite empreintés (assets/) : cache long ; HTML : toujours revalidé pour voir une release tout de suite
map $uri $cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~\.html$    "no-cache";
    /           "no-cache";
    default     "public, max-age=604800";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    server_tokens off;
    # Les redirections gardent le domaine vu par le visiteur, pas celui du conteneur
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # Tous les en-têtes ici seulement : un add_header dans un location effacerait ceux du serveur
    add_header Cache-Control $cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://dashility.costamask.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Repli sur index.html : prêt pour Vue Router en mode historique
    location / {
        try_files $uri $uri/ /index.html;
    }
}
