# Le site est caché pour le moment : la prod sert les maquettes des carrousels (docs/06-maquettes/carrousels),
# pour que la cliente choisisse depuis son domaine. Hors des moteurs de recherche (noindex).
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Maquettes statiques sans données : scripts et styles en ligne permis, images de démonstration en data:
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les anciennes adresses du site (/fr, /en/projets/…) mènent au sommaire des maquettes
    location / {
        try_files $uri $uri/ @sommaire;
    }
    location @sommaire {
        return 302 /;
    }
}
