# Sur le serveur, dans /srv/docker/Projects/graphist. Une tâche cron toutes les 5 minutes :
#   cd /srv/docker/Projects/graphist && docker compose up -d --pull always --quiet-pull 2>&1 | grep -v " Running$" | logger -t graphist-deploy
# ne recrée le conteneur que si une nouvelle image `latest` est sur GHCR. Journal : journalctl -t graphist-deploy
# Retour arrière : IMAGE_TAG=<empreinte du commit> dans .env (même dossier), puis la même commande ; retirer la ligne pour revenir à latest.
name: graphist

services:
  site:
    image: ghcr.io/k0konut/graphist_portfolio:${IMAGE_TAG:-latest}
    container_name: graphist-site
    restart: unless-stopped
    # Le réseau de Nginx Proxy Manager, qui joint le conteneur par son nom
    networks: [npm]

networks:
  npm:
    external: true
