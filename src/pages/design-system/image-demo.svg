<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <!-- Image de démonstration de la vitrine : rayures, pour voir la transparence du calque -->
  <defs>
    <pattern id="r" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="120" height="120" fill="#e9e9e9" />
      <rect width="60" height="120" fill="#2b2b2b" />
    </pattern>
  </defs>
  <rect width="1200" height="1500" fill="url(#r)" />
</svg>
