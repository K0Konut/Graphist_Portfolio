<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diaporama — maquette page projet</title>
    <link rel="stylesheet" href="commun.css" />
    <link rel="stylesheet" href="projet.css" />
    <style>
      #contenu {
        display: grid;
        grid-template-columns: minmax(340px, 32%) 1fr;
        min-height: 100svh;
      }
      .presentation {
        display: flex;
        flex-direction: column;
        gap: var(--espace-4);
        padding: calc(var(--degagement) + var(--espace-4)) var(--marge) 0;
      }
      .presentation h1 {
        font-size: clamp(2rem, 3.4vw, 3rem);
        line-height: 1.05;
      }
      .accroche {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.3;
      }
      .presentation h2 {
        font-size: 1rem;
        line-height: 1.4;
      }
      .presentation .fiche {
        grid-template-columns: 1fr 1fr;
      }
      .presentation .suite {
        margin-top: auto;
        padding-bottom: var(--espace-5);
      }
      /* La scène : une image à la fois sur l'aplat du projet */
      .scene {
        position: sticky;
        top: 0;
        height: 100svh;
        display: grid;
        grid-template-rows: 1fr auto;
        gap: var(--espace-3);
        padding: var(--degagement) var(--marge) calc(var(--espace-3) + 48px);
        background: var(--aplat);
        color: var(--aplat-texte);
        touch-action: pan-y;
      }
      .scene .cadre {
        min-height: 0;
        display: grid;
        place-items: center;
      }
      .scene img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
      }
      .commandes {
        display: flex;
        align-items: center;
        gap: var(--espace-3);
      }
      .commandes .legende {
        flex: 1;
        display: grid;
        font-size: var(--taille-legende);
      }
      .commandes strong {
        font-size: 1rem;
      }
      .commandes button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 2px solid currentColor;
        font-size: 1.25rem;
        font-weight: 800;
      }
      .compteur {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      @media (width <= 700px) {
        #contenu {
          grid-template-columns: 1fr;
        }
        .scene {
          position: static;
          order: -1;
          height: 80svh;
          padding-bottom: var(--espace-3);
        }
      }
    </style>
  </head>
  <body>
    <main id="contenu"></main>
    <script src="commun.js"></script>
    <script src="projet.js"></script>
    <script>
      let images = []
      let actif = 0
      function montrer(i) {
        actif = M.modulo(i, images.length)
        const g = images[actif]
        const img = document.querySelector('.scene img')
        img.src = g.src
        img.alt = `${g.legende} (image provisoire)`
        img.style.aspectRatio = g.ratio
        document.querySelector('.scene strong').textContent = g.legende
        document.querySelector('.scene .texte-image').textContent = g.texte
        document.querySelector('.compteur').textContent = `${actif + 1} / ${images.length}`
        M.fondu(img)
      }
      M.page((p, r, k) => {
        images = r.galerie
        document.getElementById('contenu').innerHTML = `
          <div class="presentation">
            <h1>${p.client} — ${p.discipline}</h1>
            <p class="accroche">${r.accroche}</p>
            <div class="texte">${r.parties.map(([t, x]) => `<h2>${t}</h2><p>${x}</p>`).join('')}</div>
            ${M.fiche(p, r)}
            ${M.provisoire}
            ${M.suite(k)}
          </div>
          <section class="scene sur-aplat" aria-roledescription="diaporama" aria-label="Images du projet">
            <div class="cadre"><img alt=""></div>
            <div class="commandes">
              <p class="legende" aria-live="polite"><strong></strong><span class="texte-image"></span></p>
              <span class="compteur"></span>
              <button type="button" data-pas="-1" aria-label="Image précédente">‹</button>
              <button type="button" data-pas="1" aria-label="Image suivante">›</button>
            </div>
          </section>`
        montrer(0)
      })
      document.addEventListener('click', (e) => {
        const b = e.target.closest('[data-pas]')
        if (b) montrer(actif + +b.dataset.pas)
      })
      // Flèches du clavier, glisser du doigt ; la molette garde le défilement de la page
      document.addEventListener('keydown', (e) => {
        if (document.getElementById('menu').open || e.altKey || e.metaKey || e.ctrlKey) return
        if (e.key === 'ArrowRight') montrer(actif + 1)
        if (e.key === 'ArrowLeft') montrer(actif - 1)
      })
      let depart = null
      document.addEventListener('pointerdown', (e) => e.target.closest('.scene .cadre') && (depart = e.clientX))
      document.addEventListener('pointerup', (e) => {
        if (depart === null) return
        const d = e.clientX - depart
        depart = null
        if (Math.abs(d) > 40) montrer(actif - Math.sign(d))
      })
    </script>
  </body>
</html>
