<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grande accroche — maquette page projet</title>
    <link rel="stylesheet" href="commun.css" />
    <link rel="stylesheet" href="projet.css" />
    <style>
      /* Premier écran : la phrase du projet, en très grand, et la fiche en bas sur un aplat */
      .ecran {
        min-height: 100svh;
        display: grid;
        grid-template-rows: 1fr auto;
      }
      .ecran .haut {
        max-width: calc(1240px + 2 * var(--marge));
        width: 100%;
        margin: 0 auto;
        padding: calc(var(--degagement) + var(--espace-5)) var(--marge) var(--espace-5);
        display: grid;
        align-content: center;
        gap: var(--espace-4);
      }
      .ecran h1 {
        font-size: 1.25rem;
        line-height: 1.3;
      }
      .ecran .accroche {
        max-width: 20ch;
        font-size: clamp(2.5rem, 6.4vw, 6rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      .bande-fiche {
        padding: var(--espace-4) var(--marge) calc(var(--espace-4) + 40px);
        background: var(--aplat);
        color: var(--aplat-texte);
      }
      .bande-fiche > * {
        max-width: 1240px;
        margin-inline: auto;
      }
      .bande-fiche .fiche {
        font-size: 1rem;
      }
      .bande-fiche .provisoire {
        margin-top: var(--espace-3);
      }
      .images {
        display: grid;
        gap: var(--espace-2);
        padding-top: var(--espace-2);
      }
      .images .duo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--espace-2);
      }
      .images img {
        height: 100%;
        max-height: 100svh;
        object-fit: cover;
      }
      .detail {
        max-width: calc(1240px + 2 * var(--marge));
        margin: 0 auto;
        padding: var(--espace-5) var(--marge) 0;
      }
      .detail .parties {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--espace-5);
      }
      .detail h2 {
        margin-bottom: var(--espace-2);
        font-size: 1.5rem;
        line-height: 1.2;
      }
      @media (width <= 700px) {
        .detail .parties,
        .images .duo {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="contenu"></main>
    <script src="commun.js"></script>
    <script src="projet.js"></script>
    <script>
      M.page((p, r, k) => {
        const [a, b, c, , , , g] = r.galerie
        document.getElementById('contenu').innerHTML = `
          <header class="ecran">
            <div class="haut">
              <h1>${p.client} — ${p.discipline}</h1>
              <p class="accroche">${r.accroche}</p>
            </div>
            <div class="bande-fiche sur-aplat">${M.fiche(p, r).replace('class="fiche"', 'class="fiche ligne"')}${M.provisoire}</div>
          </header>
          <div class="images galerie">
            ${M.image(a)}
            <div class="duo">${M.image(b)}${M.image(c)}</div>
            ${M.image(g)}
          </div>
          <div class="detail">
            <div class="parties texte">${r.parties.map(([t, x]) => `<section><h2>${t}</h2><p>${x}</p></section>`).join('')}</div>
            ${M.suite(k)}
          </div>`
      })
    </script>
  </body>
</html>
