<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Images légendées — maquette page projet</title>
    <link rel="stylesheet" href="commun.css" />
    <link rel="stylesheet" href="projet.css" />
    <style>
      #contenu {
        max-width: calc(1240px + 2 * var(--marge));
        margin: 0 auto;
        padding: calc(var(--degagement) + var(--espace-5)) var(--marge) 0;
      }
      .tete {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: var(--espace-4) var(--espace-5);
        padding-bottom: var(--espace-5);
      }
      .tete h1 {
        grid-column: 1 / 7;
        font-size: clamp(2.5rem, 5vw, 4rem);
        line-height: 1.05;
      }
      .tete .texte {
        grid-column: 7 / -1;
        align-self: end;
      }
      .tete .accroche {
        margin-bottom: var(--espace-3);
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.35;
      }
      .tete :is(.fiche, .provisoire) {
        grid-column: 1 / -1;
      }
      /* Chaque image a son cartel, comme dans une exposition */
      .oeuvres {
        display: grid;
        gap: var(--espace-5);
      }
      .oeuvre {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: var(--espace-4);
        align-items: end;
      }
      .oeuvre img {
        grid-column: 1 / 9;
        max-height: 85svh;
        width: auto;
        max-width: 100%;
      }
      .oeuvre:nth-child(even) img {
        grid-column: 5 / -1;
        justify-self: end;
      }
      .oeuvre:nth-child(even) .cartel {
        grid-row: 1;
        grid-column: 1 / 5;
      }
      .cartel {
        grid-column: 9 / -1;
        display: grid;
        gap: var(--espace-2);
        padding: var(--marge-calque);
        background: var(--aplat);
        color: var(--aplat-texte);
        font-size: var(--taille-legende);
        line-height: 1.45;
      }
      .cartel strong {
        font-size: 1.125rem;
        line-height: 1.25;
      }
      @media (width <= 700px) {
        .tete,
        .oeuvre {
          grid-template-columns: minmax(0, 1fr);
        }
        .tete > :is(*, .texte),
        .oeuvre:nth-child(n) > :is(img, .cartel) {
          grid-column: 1;
          grid-row: auto;
        }
      }
    </style>
  </head>
  <body>
    <main id="contenu"></main>
    <script src="commun.js"></script>
    <script src="projet.js"></script>
    <script>
      M.page((p, r, k) => {
        const n = r.galerie.length
        document.getElementById('contenu').innerHTML = `
          <header class="tete">
            <h1>${p.client} — ${p.discipline}</h1>
            <div class="texte"><p class="accroche">${r.accroche}</p><p>${r.parties[0][1]} ${r.parties[2][1]}</p></div>
            ${M.fiche(p, r).replace('class="fiche"', 'class="fiche ligne"')}
            ${M.provisoire}
          </header>
          <div class="oeuvres galerie">${r.galerie
            .map(
              (g, i) => `<figure class="oeuvre">${M.image(g)}
                <figcaption class="cartel sur-aplat"><strong>${g.legende}</strong><span>${g.texte}</span><span>${i + 1} sur ${n}</span></figcaption></figure>`,
            )
            .join('')}</div>
          ${M.suite(k)}`
      })
    </script>
  </body>
</html>
