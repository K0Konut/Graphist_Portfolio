<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bandeau — maquette page projet</title>
    <link rel="stylesheet" href="commun.css" />
    <link rel="stylesheet" href="projet.css" />
    <style>
      body {
        background: var(--teinte);
      }
      .bandeau {
        padding: calc(var(--degagement) + var(--espace-5)) var(--marge) var(--espace-5);
        background: var(--aplat);
        color: var(--aplat-texte);
        text-align: center;
      }
      .bandeau h1 {
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        line-height: 1.05;
      }
      .corps {
        max-width: calc(var(--contenu) + 2 * var(--marge));
        margin: 0 auto;
        padding: var(--espace-5) var(--marge) 0;
      }
      .presentation {
        display: grid;
        grid-template-columns: 1fr 3fr;
        gap: var(--espace-5);
      }
      .accroche {
        max-width: 36ch;
        margin-bottom: var(--espace-4);
        font-size: clamp(1.25rem, 2vw, 1.625rem);
        font-weight: 700;
        line-height: 1.3;
      }
      .colonnes {
        columns: 2;
        column-gap: var(--espace-5);
      }
      .colonnes section {
        break-inside: avoid;
        margin-bottom: var(--espace-4);
      }
      .colonnes h2 {
        font-size: 1rem;
        line-height: 1.4;
      }
      .mosaique {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: var(--espace-2);
        margin-top: var(--espace-5);
      }
      .mosaique img {
        height: 100%;
        object-fit: cover;
      }
      .pleine {
        grid-column: span 6;
      }
      .moitie {
        grid-column: span 3;
      }
      .tiers {
        grid-column: span 2;
      }
      @media (width <= 700px) {
        .presentation {
          grid-template-columns: 1fr;
          gap: var(--espace-4);
        }
        .presentation > :first-child {
          order: 1;
        }
        .colonnes {
          columns: 1;
        }
        .tiers {
          grid-column: span 3;
        }
        .tiers:last-of-type {
          grid-column: span 6;
        }
      }
    </style>
  </head>
  <body>
    <main id="contenu"></main>
    <script src="commun.js"></script>
    <script src="projet.js"></script>
    <script>
      M.page((p, r, k) => {
        document.getElementById('contenu').innerHTML = `
          <header class="bandeau"><h1>${p.client} — ${p.discipline}</h1></header>
          <div class="corps">
            <div class="presentation">
              <div>${M.fiche(p, r)}${M.provisoire}</div>
              <div class="texte">
                <p class="accroche">${r.accroche}</p>
                <div class="colonnes">${r.parties.map(([t, x]) => `<section><h2>${t}</h2><p>${x}</p></section>`).join('')}</div>
              </div>
            </div>
            <div class="galerie mosaique">${r.galerie.map((g) => M.image(g, `class="${g.largeur}"`)).join('')}</div>
            ${M.suite(k)}
          </div>`
      })
    </script>
  </body>
</html>
