<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page en aplat — maquette page projet</title>
    <link rel="stylesheet" href="commun.css" />
    <link rel="stylesheet" href="projet.css" />
    <style>
      body {
        background: var(--aplat);
        color: var(--aplat-texte);
      }
      #contenu {
        max-width: calc(1240px + 2 * var(--marge));
        margin: 0 auto;
        padding: calc(var(--degagement) + var(--espace-5)) var(--marge) 0;
      }
      h1 {
        font-size: clamp(3rem, 9vw, 8.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      .ouverture {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: var(--espace-5);
        margin-top: var(--espace-5);
        padding-bottom: var(--espace-5);
      }
      .accroche {
        margin-bottom: var(--espace-4);
        font-size: clamp(1.25rem, 2vw, 1.75rem);
        font-weight: 700;
        line-height: 1.3;
        max-width: 32ch;
      }
      .colonnes {
        columns: 2;
        column-gap: var(--espace-5);
      }
      .colonnes p {
        break-inside: avoid;
      }
      .mosaique {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: var(--espace-2);
      }
      .mosaique img {
        height: 100%;
        object-fit: cover;
      }
      .pleine {
        grid-column: span 6;
      }
      .moitie {
        grid-column: span 3;
      }
      .tiers {
        grid-column: span 2;
      }
      @media (width <= 700px) {
        .ouverture {
          grid-template-columns: 1fr;
        }
        .ouverture > :first-child {
          order: 1;
        }
        .colonnes {
          columns: 1;
        }
        .moitie,
        .tiers {
          grid-column: span 6;
        }
      }
    </style>
  </head>
  <body class="sur-aplat">
    <main id="contenu"></main>
    <script src="commun.js"></script>
    <script src="projet.js"></script>
    <script>
      M.page((p, r, k) => {
        document.getElementById('contenu').innerHTML = `
          <h1>${p.client} — ${p.discipline}</h1>
          <div class="ouverture">
            <div>${M.fiche(p, r)}${M.provisoire}</div>
            <div class="texte">
              <p class="accroche">${r.accroche}</p>
              <div class="colonnes">${r.parties.map(([, x]) => `<p>${x}</p>`).join('')}</div>
            </div>
          </div>
          <div class="galerie mosaique">${r.galerie.map((g) => M.image(g, `class="${g.largeur}"`)).join('')}</div>
          ${M.suite(k)}`
      })
    </script>
  </body>
</html>
