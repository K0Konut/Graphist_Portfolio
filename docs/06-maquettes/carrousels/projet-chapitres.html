<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chapitres — maquette page projet</title>
    <link rel="stylesheet" href="commun.css" />
    <link rel="stylesheet" href="projet.css" />
    <style>
      html {
        scroll-padding-top: var(--degagement);
      }
      @media (prefers-reduced-motion: no-preference) {
        html {
          scroll-behavior: smooth;
        }
      }
      #contenu {
        max-width: calc(1240px + 2 * var(--marge));
        margin: 0 auto;
        padding: calc(var(--degagement) + var(--espace-5)) var(--marge) 0;
        display: grid;
        grid-template-columns: 240px 1fr;
        column-gap: var(--espace-5);
      }
      .tete {
        grid-column: 1 / -1;
        display: grid;
        gap: var(--espace-4);
        padding-bottom: var(--espace-5);
      }
      .tete h1 {
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        line-height: 1.05;
        max-width: 18ch;
      }
      .accroche {
        max-width: 36ch;
        font-size: clamp(1.25rem, 2vw, 1.625rem);
        font-weight: 700;
        line-height: 1.3;
      }
      /* Sommaire qui suit la lecture */
      .sommaire {
        position: sticky;
        top: var(--degagement);
        align-self: start;
        display: grid;
        gap: var(--espace-4);
      }
      .sommaire ol {
        list-style: none;
        padding: 0;
        display: grid;
        gap: var(--espace-1);
      }
      .sommaire a {
        display: flex;
        gap: var(--espace-2);
        min-height: 36px;
        align-items: center;
        color: var(--gris);
        text-decoration: none;
      }
      .sommaire a:hover,
      .sommaire a[aria-current] {
        color: var(--noir);
      }
      .sommaire a[aria-current] {
        font-weight: 800;
      }
      .sommaire a[aria-current] .num {
        background: var(--aplat);
        color: var(--aplat-texte);
      }
      .num {
        flex: none;
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        font-size: var(--taille-legende);
        font-weight: 800;
        background: var(--vide);
        transition: background-color var(--duree-standard) var(--ease-signature);
      }
      .chapitre {
        padding-bottom: var(--espace-5);
      }
      .chapitre h2 {
        display: flex;
        align-items: center;
        gap: var(--espace-3);
        margin-bottom: var(--espace-4);
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        line-height: 1.1;
      }
      .chapitre h2 .num {
        width: 1.6em;
        height: 1.6em;
        font-size: 1em;
        background: var(--aplat);
        color: var(--aplat-texte);
      }
      .chapitre .texte p {
        font-size: 1.1875rem;
      }
      .chapitre .galerie {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: var(--espace-2);
        margin-top: var(--espace-4);
      }
      .chapitre .galerie img {
        height: 100%;
        max-height: 70svh;
        object-fit: cover;
      }
      .apres {
        grid-column: 2;
      }
      @media (width <= 860px) {
        #contenu {
          grid-template-columns: 1fr;
        }
        .sommaire {
          position: static;
          padding-bottom: var(--espace-5);
        }
        .apres {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <main id="contenu"></main>
    <script src="commun.js"></script>
    <script src="projet.js"></script>
    <script>
      let suivi
      M.page((p, r, k) => {
        const g = r.galerie
        const images = [[g[1]], [g[2], g[3]], [g[0]], [g[4], g[5], g[6]]]
        const chapitres = r.parties.map(([t, x], i) => ({ id: 'chapitre-' + (i + 1), t, x, images: images[i] }))
        document.getElementById('contenu').innerHTML = `
          <header class="tete">
            <h1>${p.client} — ${p.discipline}</h1>
            <p class="accroche">${r.accroche}</p>
          </header>
          <nav class="sommaire" aria-label="Chapitres">
            <ol>${chapitres.map((c, i) => `<li><a href="#${c.id}"><span class="num">${i + 1}</span>${c.t}</a></li>`).join('')}</ol>
            ${M.fiche(p, r)}
            ${M.provisoire}
          </nav>
          <div class="chapitres">${chapitres
            .map(
              (c, i) => `<section class="chapitre" id="${c.id}" aria-labelledby="${c.id}-titre">
                <h2 id="${c.id}-titre"><span class="num" aria-hidden="true">${i + 1}</span>${c.t}</h2>
                <div class="texte"><p>${c.x}</p></div>
                <div class="galerie">${c.images.map((im) => M.image(im)).join('')}</div>
              </section>`,
            )
            .join('')}</div>
          <div class="apres">${M.suite(k)}</div>`

        // Le chapitre en cours de lecture est marqué dans le sommaire
        suivi?.disconnect()
        const liens = [...document.querySelectorAll('.sommaire a')]
        suivi = new IntersectionObserver(
          (entrees) => {
            for (const e of entrees) {
              if (!e.isIntersecting) continue
              liens.forEach((a) => a.toggleAttribute('aria-current', a.hash === '#' + e.target.id))
            }
          },
          { rootMargin: '-30% 0px -60% 0px' },
        )
        document.querySelectorAll('.chapitre').forEach((s) => suivi.observe(s))
      })
      // Les liens du sommaire ne changent pas de projet
      document.addEventListener('click', (e) => {
        const a = e.target.closest('.sommaire a')
        if (!a) return
        e.preventDefault()
        document.querySelector(a.hash).scrollIntoView()
      })
    </script>
  </body>
</html>
